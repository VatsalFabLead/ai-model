name: Python CI and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate Python App
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python app imports
        run: |
          python -m compileall app scripts run.py wsgi.py passenger_wsgi.py
          python -c "import app.main; print('App import ok')"

  deploy:
    name: Deploy to Hostinger FTP
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Deploy via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST || '82.29.163.188' }}
          FTP_USER: ${{ secrets.FTP_USER || 'u378554361.fabaifptusr' }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD || 'W;0xUPg>3XL' }}
        run: |
          python scripts/deploy_ftp.py
